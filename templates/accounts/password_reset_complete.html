{% extends 'base.html' %}
{% block title %}Password Reset Complete — MoodFlix{% endblock %}
{% block content %}
<div class="container" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: var(--spacing-2xl); width: 100%; max-width: 440px; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: var(--spacing-md); color: var(--success);">✓</div>
    <h1 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Password Reset!</h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem;">Your password has been set successfully. You can now log in with your new credentials.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="margin-top: var(--spacing-lg); width: 100%;">Sign In Now</a>
  </div>
</div>
{% endblock %}
