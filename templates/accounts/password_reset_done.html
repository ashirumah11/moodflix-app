{% extends 'base.html' %}
{% block title %}Reset Link Sent — MoodFlix{% endblock %}
{% block content %}
<div class="container" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: var(--spacing-2xl); width: 100%; max-width: 440px; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">📧</div>
    <h1 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Check Your Inbox</h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">
      If an account exists with the email you entered, we have sent instructions to reset your password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="margin-top: var(--spacing-lg);">Return to Login</a>
  </div>
</div>
{% endblock %}
